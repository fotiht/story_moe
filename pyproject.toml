[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-moe"
version = "0.0.1"
description = "Decoder-only transformer with RoPE, sparse Top-2 MoE, and KV cache, trained on TinyStories"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
