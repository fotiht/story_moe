# Debug-tier MoE. Identical to debug_dense except the feed-forward sublayer.
# Diff these two files before any comparison run. Only the `use_moe`,
# `n_experts`, `top_k`, `expert_width`, `aux_loss_weight` and `out_dir` lines
# should differ.
name: debug_moe

model:
  n_layers: 2
  d_model: 128
  n_heads: 4
  d_head: 32
  max_seq_len: 256
  use_moe: true
  n_experts: 4
  top_k: 2
  expert_width: 256     # dense_width above is 2 * this
  aux_loss_weight: 0.01
  rope_base: 10000.0
  dropout: 0.0
  tie_weights: true
  bias: false

data:
  dataset: roneneldan/TinyStories
  tokenizer: gpt2
  train_stories: 1000
  val_stories: 200
  seed: 1234
  block_size: 128
  stride: null
  cache_dir: data/cache

train:
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 20
  microbatch_size: 4
  accum_steps: 8
  max_tokens: 1000000
  eval_every: 250
  ckpt_every: 250
  out_dir: checkpoints/debug_moe
  device: cuda
  precision: fp32
  require_gpu_name: null
